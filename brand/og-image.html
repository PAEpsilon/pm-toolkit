<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:627px;overflow:hidden}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#141827;color:#fff;position:relative}
.glow{position:absolute;right:-180px;top:-180px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#4f46e5 0%,rgba(79,70,229,0) 65%);opacity:.45}
.left{position:absolute;left:80px;top:130px;width:600px}
.brand{display:flex;align-items:center;gap:22px}
.brand img{width:96px;height:96px}
.brand h1{font-size:64px;font-weight:700;letter-spacing:-1px}
.brand h1 b{color:#a5b4fc}
.sub{margin-top:34px;font-size:34px;line-height:1.3;color:#e5e7ff;font-weight:600}
.pills{display:flex;gap:12px;margin-top:34px}
.pill{border:1px solid #39406a;background:#1f2437;border-radius:999px;padding:9px 18px;font-size:20px;color:#d6d9e3}
.url{position:absolute;left:80px;bottom:56px;font-size:22px;color:#8a90a6}
.board{position:absolute;right:70px;top:150px;display:flex;gap:16px}
.col{width:150px;background:#1f2437;border:1px solid #2c3350;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.col.mvp{border-color:#818cf8;background:#272d52}
.col h3{font-size:15px;color:#a5b4fc;font-weight:600;margin-bottom:2px}
.card{background:#fff;border-radius:10px;height:58px;display:flex;align-items:center;gap:8px;padding:0 10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.line{height:8px;border-radius:4px;background:#d1d5db;flex:1}
.g{background:#16a34a}.y{background:#eab308}.r{background:#dc2626}
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="brand"><img src="../assets/logo.svg" alt=""><h1>PM <b>Toolkit</b></h1></div>
  <p class="sub">Herramientas gratuitas de Product Management, en español</p>
  <div class="pills"><span class="pill">✓ Gratis</span><span class="pill">✓ Sin registro</span><span class="pill">✓ Privado</span></div>
</div>
<div class="board">
  <div class="col mvp"><h3>Ola 1 · MVP</h3>
    <div class="card"><i class="dot g"></i><i class="line"></i></div>
    <div class="card"><i class="dot g"></i><i class="line" style="flex:.7"></i></div>
    <div class="card"><i class="dot y"></i><i class="line"></i></div></div>
  <div class="col"><h3>Ola 2</h3>
    <div class="card"><i class="dot y"></i><i class="line" style="flex:.6"></i></div>
    <div class="card"><i class="dot g"></i><i class="line"></i></div></div>
  <div class="col"><h3>Ola 3</h3>
    <div class="card"><i class="dot r"></i><i class="line" style="flex:.8"></i></div></div>
</div>
<div class="url">paepsilon.github.io/pm-toolkit</div>
</body></html>
